name: Playwright Tests
on:
  workflow_dispatch:
  
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install dependencies
      run: npm ci
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
    - name: Install Playwright Browsers
      run: |
          mkdir -p ~/.cache/ms-playwright/chromium-1208/chrome-linux
          wget -q "https://cdn.playwright.dev/builds/cft/145.0.7632.6/linux64/chrome-linux64.zip" -O /tmp/chrome.zip
          unzip -q /tmp/chrome.zip -d /tmp/chrome-extracted
          cp -r /tmp/chrome-extracted/chrome-linux64/* ~/.cache/ms-playwright/chromium-1208/chrome-linux/
          chmod +x ~/.cache/ms-playwright/chromium-1208/chrome-linux/chrome
      timeout-minutes: 10
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
